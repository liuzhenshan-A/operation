<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保费概况 - 运营工作台</title>
  <link rel="stylesheet" href="css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    .product-tags {
      display: flex;
      gap: 24px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .product-tags .label {
      color: #666;
      font-weight: 500;
    }
    .product-tags .items {
      color: #333;
    }
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .chart-card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .chart-card .chart-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-container {
      width: 100%;
      height: 300px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon">📋</div>
        <h1>运营工作台</h1>
      </div>
      <nav id="sidebar-menu"></nav>
    </aside>
    <div class="main-content">
      <div class="page-header">
        <h2 id="page-title">保费概况</h2>
      </div>
      <div class="page-body">
        <div class="card">
          <div class="card-title">查询条件</div>
          <form class="search-form">
            <div class="form-item">
              <label>截止年月</label>
              <input type="month" id="endDate" value="">
              <span class="help-icon" data-title="选择数据统计截止月份，默认为当前月份">?</span>
            </div>
            <div class="form-item">
              <label>保险类别</label>
              <select id="insuranceType">
                <option value="">全部</option>
                <option value="supplement">补充医疗</option>
                <option value="employer">雇主</option>
              </select>
              <span class="help-icon" data-title="按保险类别筛选，默认显示全部类别">?</span>
            </div>
            <div class="form-item">
              <label>所属客服</label>
              <input type="text" id="customerService" placeholder="请输入客服姓名">
              <span class="help-icon" data-title="输入客服姓名进行精准查询">?</span>
            </div>
            <button type="button" class="search-btn" onclick="search()">查询</button>
            <button type="button" class="search-btn" style="background:#d9d9d9" onclick="resetForm()">重置</button>
          </form>
        </div>

        <div class="product-tags">
          <div>
            <span class="label">雇主产品：</span>
            <span class="items">：补工伤、雇主、企福安康、易企保雇主、易保无忧、团体意外</span>
          </div>
          <div>
            <span class="label">补医产品：</span>
            <span class="items">补充医疗、意外险、大额医疗、易企药安心、百万医疗、易企保</span>
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            <span class="icon-cell">
              <span class="mini-icon"></span>
              保费账期分析
            </span>
            <span class="help-icon" data-title="根据查询截止年月，以3个月为一个账期向前展示（不含查询当月），例如查询2026-07，则账期为2026-04 ~ 2026-06">?</span>
            <button type="button" class="search-btn" style="margin-left:auto;font-size:12px;padding:6px 16px" onclick="viewDetail()">查看明细</button>
          </div>
          <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>账期</th>
                <th>应收保费(元)</th>
                <th>核销金额(元)</th>
                <th>欠款金额(元)</th>
                <th>回款率</th>
              </tr>
            </thead>
            <tbody id="premiumTableBody">
            </tbody>
          </table>
          </div>
        </div>

        <div class="charts-grid">
          <div class="chart-card">
            <div class="chart-title">
              保费趋势（补医）
              <span class="help-icon" data-title="根据查询截止年月，往前推12个月（不含查询当月）">?</span>
            </div>
            <div class="chart-container" id="chartSupplement"></div>
          </div>
          <div class="chart-card">
            <div class="chart-title">
              保费趋势（雇主）
              <span class="help-icon" data-title="根据查询截止年月，往前推12个月（不含查询当月）">?</span>
            </div>
            <div class="chart-container" id="chartEmployer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var today = new Date();
      var year = today.getFullYear();
      var month = String(today.getMonth() + 1).padStart(2, '0');
      document.getElementById('endDate').value = year + '-' + month;
    });

    function search() {
      var endDate = document.getElementById('endDate').value;
      var insuranceType = document.getElementById('insuranceType').value;
      var customerService = document.getElementById('customerService').value;
      console.log('查询条件:', { endDate, insuranceType, customerService });
    }

    function resetForm() {
      var today = new Date();
      var year = today.getFullYear();
      var month = String(today.getMonth() + 1).padStart(2, '0');
      document.getElementById('endDate').value = year + '-' + month;
      document.getElementById('insuranceType').value = '';
      document.getElementById('customerService').value = '';
    }

    function viewDetail() {
      console.log('查看明细');
    }

    // 初始化图表
    function initCharts() {
      // 保费趋势（补医）
      var chartSupplement = echarts.init(document.getElementById('chartSupplement'));
      chartSupplement.setOption({
        tooltip: {
          trigger: 'axis',
          formatter: '{b}<br/>{a}: {c}万元'
        },
        grid: {
          top: 10,
          right: 20,
          bottom: 30,
          left: 50
        },
        xAxis: {
          type: 'category',
          data: ['2025-08', '2025-09', '2025-10', '2025-11', '2025-12', '2026-01', '2026-02', '2026-03', '2026-04', '2026-05', '2026-06', '2026-07'],
          axisLine: {
            lineStyle: { color: '#e8e8e8' }
          },
          axisLabel: {
            color: '#999',
            fontSize: 11,
            rotate: 30
          }
        },
        yAxis: {
          type: 'value',
          name: '万元',
          nameTextStyle: {
            color: '#999',
            fontSize: 12,
            padding: [0, 30, 0, 0]
          },
          axisLine: {
            show: false
          },
          axisLabel: {
            color: '#999',
            fontSize: 12
          },
          splitLine: {
            lineStyle: {
              color: '#f0f0f0'
            }
          }
        },
        series: [{
          name: '保费',
          type: 'bar',
          data: [650, 720, 800, 850, 820, 780, 830, 890, 920, 950, 980, 1020],
          itemStyle: {
            color: '#1890ff'
          },
          barWidth: '60%'
        }]
      });

      // 保费趋势（雇主）
      var chartEmployer = echarts.init(document.getElementById('chartEmployer'));
      chartEmployer.setOption({
        tooltip: {
          trigger: 'axis',
          formatter: '{b}<br/>{a}: {c}万元'
        },
        grid: {
          top: 10,
          right: 20,
          bottom: 30,
          left: 50
        },
        xAxis: {
          type: 'category',
          data: ['2025-08', '2025-09', '2025-10', '2025-11', '2025-12', '2026-01', '2026-02', '2026-03', '2026-04', '2026-05', '2026-06', '2026-07'],
          axisLine: {
            lineStyle: { color: '#e8e8e8' }
          },
          axisLabel: {
            color: '#999',
            fontSize: 11,
            rotate: 30
          }
        },
        yAxis: {
          type: 'value',
          name: '万元',
          nameTextStyle: {
            color: '#999',
            fontSize: 12,
            padding: [0, 30, 0, 0]
          },
          axisLine: {
            show: false
          },
          axisLabel: {
            color: '#999',
            fontSize: 12
          },
          splitLine: {
            lineStyle: {
              color: '#f0f0f0'
            }
          }
        },
        series: [{
          name: '保费',
          type: 'bar',
          data: [320, 380, 420, 450, 480, 430, 460, 500, 520, 550, 580, 620],
          itemStyle: {
            color: '#faad14'
          },
          barWidth: '60%'
        }]
      });

      // 窗口 resize 时重绘图表
      window.addEventListener('resize', function() {
        chartSupplement.resize();
        chartEmployer.resize();
      });
    }

    // 页面加载完成后初始化图表
    window.addEventListener('load', function() {
      initCharts();
      initTable();
    });

    function initTable() {
      var endDate = document.getElementById('endDate').value;
      if (!endDate) {
        var now = new Date();
        endDate = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('endDate').value = endDate;
      }
      generateTable(endDate);
    }

    function generateTable(endDateStr) {
      var parts = endDateStr.split('-');
      var endYear = parseInt(parts[0]);
      var endMonth = parseInt(parts[1]);

      var tbody = document.getElementById('premiumTableBody');
      var rows = '';

      var data = [
        { period: '2026-04 ~ 2026-06', receivable: '3,850.00', verified: '3,720.50', debt: '129.50', rate: '96.6%', monthsAgo: 3 },
        { period: '2026-01 ~ 2026-03', receivable: '3,420.00', verified: '3,285.30', debt: '134.70', rate: '96.1%', monthsAgo: 6 },
        { period: '2025-10 ~ 2025-12', receivable: '3,180.00', verified: '3,095.20', debt: '84.80', rate: '97.3%', monthsAgo: 9 },
        { period: '2025-07 ~ 2025-09', receivable: '2,950.00', verified: '2,860.40', debt: '89.60', rate: '97.0%', monthsAgo: 12 },
        { period: '12个月以上', receivable: '2,780.00', verified: '2,710.50', debt: '69.50', rate: '97.5%', monthsAgo: 15 },
      ];

      data.forEach(function(item) {
        var periodDisplay = item.monthsAgo > 12 ? '12个月以上' : item.period;
        rows += '<tr>';
        rows += '<td>' + periodDisplay + '</td>';
        rows += '<td>' + item.receivable + '</td>';
        rows += '<td>' + item.verified + '</td>';
        rows += '<td>' + item.debt + '</td>';
        rows += '<td>' + item.rate + '</td>';
        rows += '</tr>';
      });

      rows += '<tr class="total-row">';
      rows += '<td>合计</td>';
      rows += '<td>18,740.00</td>';
      rows += '<td>18,167.70</td>';
      rows += '<td>572.30</td>';
      rows += '<td>97.0%</td>';
      rows += '</tr>';

      tbody.innerHTML = rows;
    }

    function search() {
      var endDate = document.getElementById('endDate').value;
      if (!endDate) {
        alert('请选择截止年月');
        return;
      }
      generateTable(endDate);
    }

    function viewDetail() {
      window.location.href = 'premium-detail.html';
    }
  </script>
</body>
</html>
