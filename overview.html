<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据总览 - 运营工作台</title>
  <link rel="stylesheet" href="css/common.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
    .kpi-card{background:#fff;border-radius:6px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);border-left:3px solid #1890ff}
    .kpi-card .kpi-label{font-size:13px;color:#8c8c8c;margin-bottom:8px}
    .kpi-card .kpi-value{font-size:28px;font-weight:600;color:#333}
    .kpi-card .kpi-sub{font-size:12px;color:#8c8c8c;margin-top:4px}
    .kpi-card.success{border-left-color:#52c41a}
    .kpi-card.warning{border-left-color:#faad14}
    .kpi-card.danger{border-left-color:#ff4d4f}
    .chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
    .chart-box{background:#fff;border-radius:6px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .chart-box h3{font-size:14px;font-weight:600;margin-bottom:12px}
    .chart-container{height:280px}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header"><div class="logo-icon">📊</div><h1>运营工作台</h1></div>
    <nav id="sidebar-menu"></nav>
  </aside>
  <div class="main-content">
    <div class="page-header"><h2 id="page-title">数据总览</h2></div>
    <div class="page-body">
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">总保费（万元）</div><div class="kpi-value">2,458</div><div class="kpi-sub">环比 <span style="color:#f5222d">↑ 12.5%</span></div></div>
        <div class="kpi-card success"><div class="kpi-label">已续签率</div><div class="kpi-value">86.3%</div><div class="kpi-sub">环比 <span style="color:#52c41a">↑ 3.2%</span></div></div>
        <div class="kpi-card warning"><div class="kpi-label">待处理客户</div><div class="kpi-value">24</div><div class="kpi-sub">即将到期 8 个</div></div>
        <div class="kpi-card danger"><div class="kpi-label">已逾期</div><div class="kpi-value">4</div><div class="kpi-sub">需尽快跟进</div></div>
      </div>
      <div class="chart-grid">
        <div class="chart-box"><h3>月度保费趋势</h3><div id="chartTrend" class="chart-container"></div></div>
        <div class="chart-box"><h3>产品类型占比</h3><div id="chartPie" class="chart-container"></div></div>
      </div>
      <div class="chart-box" style="margin-bottom:16px"><h3>各部门业绩对比</h3><div id="chartBar" class="chart-container"></div></div>
    </div>
  </div>
</div>
<script src="js/common.js"></script>
<script>
setPageTitle('数据总览');
setTimeout(function(){
  try{
    var c1=echarts.init(document.getElementById('chartTrend'));
    c1.setOption({
      tooltip:{trigger:'axis'},
      legend:{data:['补充医疗','雇主险']},
      grid:{left:40,right:20,top:40,bottom:30},
      xAxis:{type:'category',data:['1月','2月','3月','4月','5月','6月','7月','8月']},
      yAxis:{type:'value',name:'万元'},
      series:[
        {name:'补充医疗',type:'line',smooth:true,data:[320,380,420,390,450,480,510,498],itemStyle:{color:'#1890ff'}},
        {name:'雇主险',type:'line',smooth:true,data:[180,200,220,250,230,260,280,295],itemStyle:{color:'#52c41a'}}
      ]
    });
    var c2=echarts.init(document.getElementById('chartPie'));
    c2.setOption({
      tooltip:{trigger:'item'},
      series:[{type:'pie',radius:['40%','70%'],data:[
        {value:48,name:'补充医疗'},{value:28,name:'雇主险'},{value:14,name:'重疾险'},{value:10,name:'意外险'}
      ]}]
    });
    var c3=echarts.init(document.getElementById('chartBar'));
    c3.setOption({
      tooltip:{trigger:'axis'},
      legend:{data:['目标','实际']},
      grid:{left:60,right:20,top:40,bottom:30},
      xAxis:{type:'category',data:['北京','上海','广州','深圳','杭州','成都']},
      yAxis:{type:'value',name:'万元'},
      series:[
        {name:'目标',type:'bar',data:[400,380,320,350,280,260],itemStyle:{color:'#d9d9d9'}},
        {name:'实际',type:'bar',data:[420,360,340,320,300,240],itemStyle:{color:'#1890ff'}}
      ]
    });
    window.addEventListener('resize',function(){c1.resize();c2.resize();c3.resize()});
  }catch(e){}
},100);
</script>
</body>
</html>
